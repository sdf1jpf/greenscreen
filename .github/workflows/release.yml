name: Release

# Push a tag like v0.1.0 to publish @greenscreen-dev/worker, @greenscreen-dev/web
# and create-greenscreen to npm. The tag must match the packages' version.
# Publishes with npm trusted publishing (OIDC): no token. Each package's
# settings on npmjs.com name this repo and release.yml as a trusted
# publisher, and npm adds provenance automatically.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - name: Check the tag matches every package version
        run: |
          for p in packages/worker packages/web packages/create; do
            v=$(node -p "require('./$p/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "$p is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm publish -w packages/worker -w packages/web -w packages/create
