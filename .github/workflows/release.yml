name: Release

# Push a tag like v0.1.0 to publish @greenscreen/worker, @greenscreen/web
# and create-greenscreen to npm. The tag must match the packages' version.
# Needs the NPM_TOKEN secret: an npm automation token that can publish to
# the scope.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches every package version
        run: |
          for p in packages/worker packages/web packages/create; do
            v=$(node -p "require('./$p/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "$p is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm publish -w packages/worker -w packages/web -w packages/create
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
